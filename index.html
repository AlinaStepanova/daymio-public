<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daymio</title>
  <meta name="description" content="Daymio — the private, on-device period tracker. Your data never leaves your phone.">
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      line-height: 1.6;
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    .app-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .sub { color: #666666; margin: 8px 0 28px; }
    ul { padding-left: 22px; }
    li { margin: 8px 0; }
    a { color: #111111; text-underline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      body { background: #16151a; color: #e7e5ea; }
      .sub { color: #9b98a3; }
      a { color: #f0eef4; }
    }
  </style>
</head>
<body>
  <p class="app-name">Daymio</p>
  <p class="sub">The private, on-device period tracker. Your data never leaves your phone.</p>
  <ul>
    <li><a href="privacy/">Privacy Policy</a></li>
  </ul>
</body>
</html>
